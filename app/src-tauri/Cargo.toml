[package]
name = "eiwaz"
version = "0.1.0"
edition = "2021"

[lib]
name = "eiwaz_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
